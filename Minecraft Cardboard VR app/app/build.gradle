plugins {
    id 'com.android.application'
}
android {
    namespace 'com.crl.minecraft.cardboard.vr'
    compileSdk 34
    defaultConfig {
        applicationId 'com.crl.minecraft.cardboard.vr'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
