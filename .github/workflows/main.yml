name: Build gyro app
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - run: sed -i 's/minSdk 24/minSdk 29/' cardboard-vr/gyro-app/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
        working-directory: cardboard-vr/gyro-app
      - uses: actions/upload-artifact@v4
        with:
          name: gyro-sender-apk
          path: cardboard-vr/gyro-app/app/build/outputs/apk/debug/*.apk
