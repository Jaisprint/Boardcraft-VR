name: Build Gyro Android app

on:
  push:
    branches: [main]
    paths:
      - "cardboard-vr-stage1.zip"
      - ".github/workflows/build-gyro-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-30" "platforms;android-31" "platforms;android-32" "platforms;android-33" "platforms;android-34" "platforms;android-35"
          sdkmanager "build-tools;30.0.3" "build-tools;31.0.0" "build-tools;32.0.0" "build-tools;33.0.0" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q cardboard-vr-stage1.zip -d extracted

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.1"

      - name: Build debug APK
        working-directory: extracted/cardboard-vr/gyro-app
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gyro-app-debug-apk
          path: extracted/cardboard-vr/gyro-app/app/build/outputs/apk/debug/*.apk
