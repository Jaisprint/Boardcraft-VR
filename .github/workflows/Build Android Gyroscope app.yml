
name: Build Minecraft Cardboard VR App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Minecraft Cardboard VR ZIP
        shell: bash
        run: |
          set -e

          ZIP="Gyroscope_app.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found!"
            exit 1
          fi

          unzip -tq "$ZIP"

          EXTRACT_DIR="$RUNNER_TEMP/minecraft-cardboard-vr"
          mkdir -p "$EXTRACT_DIR"

          unzip -q -o "$ZIP" -d "$EXTRACT_DIR"

          echo "Extracted project structure:"
          find "$EXTRACT_DIR" -maxdepth 7 -type d | sort

          APP_GRADLE=$(find "$EXTRACT_DIR" \
            -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found!"
            exit 1
          fi

          APP_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Found Android project: $APP_DIR"

      - name: Verify Minecraft Cardboard VR package
        shell: bash
        run: |
          set -e

          MAIN=$(find "$APP_DIR/app/src/main/java" \
            -type f -name MainActivity.java -print -quit)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found!"
            find "$APP_DIR/app/src/main/java" -type f
            exit 1
          fi

          if [ ! -f "$APP_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found!"
            exit 1
          fi

          if ! grep -q '^package com\.crl\.minecraft\.cardboard\.vr;' "$MAIN"; then
            echo "ERROR: Incorrect MainActivity package!"
            head -n 10 "$MAIN"
            exit 1
          fi

          echo "Application verified: $MAIN"

      - name: Set minimum SDK
        shell: bash
        run: |
          set -e
          sed -i 's/minSdk 24/minSdk 27/' "$APP_DIR/app/build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Minecraft Cardboard VR
        shell: bash
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.APP_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-cardboard-vr-apk
          path: "${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
