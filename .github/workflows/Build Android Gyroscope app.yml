
name: Build Gyroscope Sender App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Verify extracted application
        run: |
          test -f "Gyroscope App/settings.gradle"
          test -f "Gyroscope App/app/build.gradle"
          test -f "Gyroscope App/app/src/main/java/com/crl/gyroscope/sender/MainActivity.java"
          test -f "Gyroscope App/app/src/main/java/com/crl/gyroscope/sender/GyroService.java"

      - name: Set minimum SDK
        run: |
          sed -i 's/minSdk 24/minSdk 27/' \
            "Gyroscope App/app/build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Gyroscope Sender
        run: gradle assembleDebug --no-daemon
        working-directory: Gyroscope App

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gyroscope-sender-apk
          path: "Gyroscope App/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
