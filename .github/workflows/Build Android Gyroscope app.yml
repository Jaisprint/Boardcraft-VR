
name: Build Gyroscope Sender App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose and verify application
        shell: bash
        run: |
          set -e

          APP_DIR="Gyroscope App"

          echo "Checking application directory..."

          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: Gyroscope App folder not found!"
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "Application contents:"
          find "$APP_DIR" -maxdepth 5 -type f | sort

          echo "Checking Gradle files..."
          test -f "$APP_DIR/settings.gradle"
          test -f "$APP_DIR/app/build.gradle"

          echo "Locating MainActivity.java..."
          MAIN_ACTIVITY=$(find "$APP_DIR" -type f -name MainActivity.java | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          echo "Found: $MAIN_ACTIVITY"

          if ! grep -q 'package com.crl.gyroscope.sender;' "$MAIN_ACTIVITY"; then
            echo "ERROR: MainActivity has an unexpected package declaration!"
            exit 1
          fi

          echo "Checking GyroService.java..."
          GYRO_SERVICE=$(find "$APP_DIR" -type f -name GyroService.java | head -n 1)

          if [ -z "$GYRO_SERVICE" ]; then
            echo "ERROR: GyroService.java not found!"
            exit 1
          fi

          echo "Application verification successful!"

      - name: Set minimum SDK
        run: |
          sed -i 's/minSdk 24/minSdk 27/' \
            "Gyroscope App/app/build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Gyroscope Sender
        run: gradle assembleDebug --no-daemon
        working-directory: Gyroscope App

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gyroscope-sender-apk
          path: "Gyroscope App/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
