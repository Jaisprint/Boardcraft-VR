
name: Build Gyroscope Sender App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Gyroscope App ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f Gyroscope_app.zip ]; then
            echo "ERROR: Gyroscope_app.zip not found!"
            exit 1
          fi

          unzip -tq Gyroscope_app.zip

          mkdir -p "$RUNNER_TEMP/gyroscope-app"
          unzip -q -o Gyroscope_app.zip -d "$RUNNER_TEMP/gyroscope-app"

          APP_DIR=$(find "$RUNNER_TEMP/gyroscope-app" \
            -type f -name settings.gradle -print -quit | xargs -r dirname)

          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/app/build.gradle" ]; then
            echo "ERROR: Android project not found in ZIP!"
            find "$RUNNER_TEMP/gyroscope-app" -maxdepth 5 -type f
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Found project: $APP_DIR"

      - name: Verify application
        shell: bash
        run: |
          set -e

          MAIN=$(find "$APP_DIR" -name MainActivity.java -print -quit)

          test -n "$MAIN"
          test -f "$APP_DIR/app/build.gradle"

          grep -q 'package com.crl.minecraft.cardboard.vr;' "$MAIN"

          echo "Application verified: $MAIN"

      - name: Set minimum SDK
        run: |
          sed -i 's/minSdk 24/minSdk 27/' "$APP_DIR/app/build.gradle"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Gyroscope Sender
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.APP_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gyroscope-sender-apk
          path: "${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
