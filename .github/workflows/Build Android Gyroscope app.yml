
name: Build Gyroscope Sender app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract modified Gyroscope Sender source
        run: |
          if [ ! -f Gyroscope_app.zip ]; then
            echo "ERROR: Gyeoscope_app.zip not found!"
            exit 1
          fi

          mkdir -p gyroscope-app
          unzip -q Gyroscope_app.zip -d gyroscope-app

          test -f gyroscope-app/settings.gradle
          test -f gyroscope-app/app/build.gradle
          test -f gyroscope-app/app/src/main/java/com/jay/gyrosender/MainActivity.java

      - name: Set minimum SDK
        run: |
          sed -i 's/minSdk 24/minSdk 27/' gyroscope-app/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build modified Gyroscope Sender
        run: gradle assembleDebug --no-daemon
        working-directory: gyroscope-app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gyro-sender-apk
          path: gyro-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
