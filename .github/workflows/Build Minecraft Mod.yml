name: Build mod
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf cardboard-vr
          unzip -qo "$(ls ./*.zip | sort | tail -1)"
          sed -i 's/isKeyDown(win, /isKeyDown(/g' cardboard-vr/mod/src/main/java/com/jay/cardboardvr/*.java
          grep -rn isKeyDown cardboard-vr/mod/src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle build --no-daemon
        working-directory: cardboard-vr/mod
      - uses: actions/upload-artifact@v4
        with:
          name: boardcraft-mod
          path: cardboard-vr/mod/build/libs/*.jar
