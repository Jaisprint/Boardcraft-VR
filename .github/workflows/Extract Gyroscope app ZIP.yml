
name: Extract Gyroscope App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check ZIP file
        run: |
          if [ ! -f Gyroscope_app.zip ]; then
            echo "ERROR: Gyroscope_app.zip not found!"
            exit 1
          fi

     
      - name: Delete old folder and extract fresh files
        shell: bash
        run: |
          set -euxo pipefail

          APP_DIR="Gyroscope App"

          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Removing previous application..."
          if [ -e "$APP_DIR" ] || [ -L "$APP_DIR" ]; then
            rm -rf -- "$APP_DIR"
          fi

          echo "Creating fresh application directory..."
          mkdir -p -- "$APP_DIR"

          echo "Extracting ZIP..."
          unzip -q -o Gyroscope_app.zip -d "$APP_DIR"

          echo "Checking extracted files..."
          test -f "$APP_DIR/settings.gradle"
          test -f "$APP_DIR/app/build.gradle"
          test -f "$APP_DIR/app/src/main/java/com/crl/gyroscope/sender/MainActivity.java"

          echo "Extraction successful!"

