
name: Extract Gyroscope App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check ZIP file
        run: |
          if [ ! -f Gyroscope_app.zip ]; then
            echo "ERROR: Gyroscope_app.zip not found!"
            exit 1
          fi

      - name: Delete old folder and extract fresh files
        run: |
          rm -rf "Gyroscope App"
          mkdir -p "Gyroscope App"

          unzip -q Gyroscope_app.zip -d "Gyroscope App"

          test -f "Gyroscope App/settings.gradle"
          test -f "Gyroscope App/app/build.gradle"
          test -f "Gyroscope App/app/src/main/java/com/jay/gyrosender/MainActivity.java"

      - name: Commit extracted application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "Gyroscope App"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update extracted Gyroscope App"
            git push
          fi
